services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    volumes:
      - searxng-data:/etc/searxng
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # resource caps: don't let SearXNG eat the whole VM (VM: 2 CPU / 4 GB)
    mem_limit: 1g
    memswap_limit: 1250m
    cpus: 1.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web-fetch-server:
    build: .
    container_name: web-fetch-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SEARXNG_URL=http://searxng:8080
      # API_KEYS is a comma-separated list (one key per user); API_KEY remains
      # a legacy alias for a single key. If neither is set the server logs a
      # warning and the /mcp endpoint stays open.
      - API_KEYS=${API_KEYS:-${API_KEY:-}}
      - MAX_FETCH_BYTES=2097152
      - FETCH_TIMEOUT=${FETCH_TIMEOUT:-20s}
      - PDF_FETCH_TIMEOUT=${PDF_FETCH_TIMEOUT:-60s}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TLS_FINGERPRINT=${TLS_FINGERPRINT:-chrome}
      - JS_RENDER=${JS_RENDER:-never}
      - JS_RENDER_TIMEOUT=${JS_RENDER_TIMEOUT:-30s}
      - CHROME_BIN=${CHROME_BIN:-}
      - RENDER_PROFILE_DIR=${RENDER_PROFILE_DIR:-}
      - RENDER_POOL_SIZE=${RENDER_POOL_SIZE:-1}
      - FETCH_CACHE_TTL=${FETCH_CACHE_TTL:-20m}
      - RENDER_CACHE_TTL=${RENDER_CACHE_TTL:-5m}
      - SEARCH_CACHE_TTL=${SEARCH_CACHE_TTL:-10m}
      - RERANK=${RERANK:-rrf}
      - RERANK_API_URL=${RERANK_API_URL:-https://routerai.ru/api/v1}
      - RERANK_API_KEY=${RERANK_API_KEY:-}
      - RERANK_MODEL=${RERANK_MODEL:-voyageai/rerank-2.5-lite}
      - RERANK_TIMEOUT=${RERANK_TIMEOUT:-3s}
    depends_on:
      searxng:
        condition: service_healthy
    # resource caps: Go server is lightweight, keep it modest. If you enable
    # JS_RENDER (headless Chromium) raise mem_limit to ~1g/2g.
    mem_limit: 512m
    memswap_limit: 640m
    cpus: 1.0
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  searxng-data:
