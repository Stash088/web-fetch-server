# Internal SearXNG config for web-fetch-server.
# See: https://docs.searxng.org/admin/settings/settings_server.html
# This instance is private (not public), so we disable the bot limiter
# which would otherwise return 403 for requests without X-Forwarded-For.
use_default_settings: true

server:
  secret_key: "change-me-internal-searxng-secret"
  limiter: false
  public_instance: false
  image_proxy: true

search:
  formats:
    - html
    - json
  # Note: category selection lives in the client (SEARCH_CATEGORIES on the
  # web-fetch-server, default "general,it") — SearXNG has no server-side
  # default_categories setting for the JSON API.

# Engine set tuning. Engine reachability below was verified live from the
# production egress IP (2026-09-02): most general-purpose engines hard- or
# soft-block datacenter IPs, while keyless vertical APIs stay open.
# Engine diversity matters: the server's RRF rerank fuses per-engine votes,
# so a single healthy engine degrades reranking to near-deterministic BM25.
#   - google cse: works keyless via API — the only healthy general engine
#   - IT verticals (default-enabled, category "it"): stackoverflow, github,
#     mdn, microsoft learn, askubuntu, superuser, docker hub — verified alive
# Disabled: soft-blocked or garbage from datacenter IPs — they waste the
# outgoing request timeout and poison results when they do answer:
#   - bing: serves random unrelated pages (zhihu/seznam/Google logins) on
#     every query — worse than no results
#   - duckduckgo: CAPTCHA; mojeek: access denied; qwant: CAPTCHA;
#     yandex: timeout
#   - brave: rate-limits without an API key (suspended_time=180 warnings)
#   - wikidata: blocked from this IP (403 from SPARQL endpoint)
#   - startpage: blocks this IP (404)
#   - ahmia, torch: fail to load in this image
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: mojeek
    disabled: true
  - name: qwant
    disabled: true
  - name: yandex
    disabled: true
  - name: brave
    disabled: true
  - name: wikidata
    disabled: true
  - name: startpage
    disabled: true
  - name: ahmia
    disabled: true
  - name: torch
    disabled: true
