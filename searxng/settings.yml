# Internal SearXNG config for web-fetch-server.
# See: https://docs.searxng.org/admin/settings/settings_server.html
# This instance is private (not public), so we disable the bot limiter
# which would otherwise return 403 for requests without X-Forwarded-For.
use_default_settings: true

server:
  secret_key: "change-me-internal-searxng-secret"
  limiter: false
  public_instance: false
  image_proxy: true

search:
  formats:
    - html
    - json

# Engine set tuning. The default set (use_default_settings) already has
# google/duckduckgo/bing/mojeek/wikipedia on; listing them here documents
# the intended set and guards against upstream defaults flipping them off.
# Engine diversity matters: the server's RRF rerank fuses per-engine votes,
# so a single healthy engine degrades reranking to near-deterministic BM25.
#   - google: works keyless from datacenter IPs (only engine observed alive
#     on the production VM)
#   - bing: usually tolerates datacenter IPs; verify after deploy
#   - mojeek: independent index, no bot wall, keyless
#   - wikipedia: language-aware (follows the query language), always reliable
#   - duckduckgo: often bot-walled from datacenter IPs; kept enabled, but
#     absence of its results in responses is expected and fine
# Disabled (noisy/unusable on a keyless private instance):
#   - brave: rate-limits without an API key (suspended_time=180 warnings)
#   - wikidata: blocked from this IP (403 from SPARQL endpoint)
#   - startpage: blocks this IP (404)
#   - ahmia, torch: fail to load in this image
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: mojeek
    disabled: false
  - name: wikipedia
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: true
  - name: wikidata
    disabled: true
  - name: startpage
    disabled: true
  - name: ahmia
    disabled: true
  - name: torch
    disabled: true
